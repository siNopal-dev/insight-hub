<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#162e6e" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Offline | Insight Hub</title>
    <style>
      body {
        margin: 0;
        background: #f4f6fa;
        color: #1e293b;
        font: 16px system-ui;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 420px;
        margin: 24px;
        background: white;
        padding: 36px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 15px 50px #162e6e12;
      }
      img {
        width: 64px;
      }
      h1 {
        font-size: 24px;
        color: #162e6e;
      }
      p {
        color: #64748b;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: #162e6e;
        color: white;
        padding: 12px 22px;
        border-radius: 10px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Insight Hub" />
      <h1>Koneksi terputus</h1>
      <p>
        Sambungkan kembali internet untuk membuka portal dan laporan Power BI. Data internal tidak
        disimpan untuk akses offline.
      </p>
      <a href="/">Coba kembali</a>
    </main>
  </body>
</html>
